<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="黑貓與灰貓一起撈小魚干、躲辣椒的 120 秒瀏覽器小遊戲。">
    <title>小魚干大作戰｜Jerky Rush</title>
  </head>
  <body>
    <main>
      <header>
        <div><p class="eyebrow">JERKY RUSH</p><h1>小魚干大作戰</h1></div>
        <dl class="hud">
          <div><dt>分數</dt><dd id="score">0</dd></div>
          <div><dt>生命</dt><dd id="lives" aria-live="polite"></dd></div>
          <div><dt>剩餘</dt><dd id="time"></dd></div>
        </dl>
      </header>
      <div class="stage">
        <canvas id="game" aria-label="小魚干大作戰遊戲區"></canvas>
        <section class="panel" aria-live="polite">
          <h2 id="panel-title">準備好了嗎？</h2>
          <ul id="rules"></ul>
          <div id="result" hidden>
            <p class="final"><span id="final-score">0</span> 分<span id="grade" class="grade"></span></p>
            <dl id="result-counts" class="counts"></dl>
          </div>
          <p id="record"></p>
          <button type="button" disabled>開始</button>
        </section>
      </div>
      <dl id="counts" class="counts"></dl>
      <p class="controls">WASD／方向鍵：移動黑貓　·　P／Esc：暫停或繼續</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
