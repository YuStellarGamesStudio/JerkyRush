<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A 120-second browser game: snacks rain from the sky and a black cat and a gray cat team up to catch them while dodging chili peppers.">
    <title>Jerky Rush</title>
    <link rel="canonical" href="https://jerkyrush.ysgs.app/">
    <!-- 分享預覽（爬蟲不執行 JS，固定使用主要語言英文）。 -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Jerky Rush">
    <meta property="og:title" content="Jerky Rush">
    <meta property="og:description" content="Snacks rain from the sky! Help a black cat and a gray cat catch dried fish and dodge chili peppers in this 120-second browser game.">
    <meta property="og:url" content="https://jerkyrush.ysgs.app/">
    <meta property="og:image" content="https://jerkyrush.ysgs.app/og-image.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Jerky Rush: a black cat and a gray cat wait to catch falling dried fish while an orange cat says Meow!">
    <meta property="og:locale" content="en_US">
    <meta property="og:locale:alternate" content="zh_TW">
    <meta property="og:locale:alternate" content="ja_JP">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Jerky Rush">
    <meta name="twitter:description" content="Snacks rain from the sky! Help a black cat and a gray cat catch dried fish and dodge chili peppers in this 120-second browser game.">
    <meta name="twitter:image" content="https://jerkyrush.ysgs.app/og-image.png">
    <meta name="twitter:image:alt" content="Jerky Rush: a black cat and a gray cat wait to catch falling dried fish while an orange cat says Meow!">
  </head>
  <body>
    <main>
      <header>
        <div><p class="eyebrow" data-i18n="eyebrow">TWO CATS · ONE SNACK RUSH</p><h1 data-i18n="title">Jerky Rush</h1></div>
        <dl class="hud">
          <div><dt data-i18n="score">Score</dt><dd id="score">0</dd></div>
          <div><dt data-i18n="lives">Lives</dt><dd id="lives" aria-live="polite"></dd></div>
          <div><dt data-i18n="time">Time</dt><dd id="time"></dd></div>
        </dl>
      </header>
      <div class="stage">
        <canvas id="game" aria-label="Jerky Rush play area"></canvas>
        <section class="panel" aria-live="polite">
          <h2 id="panel-title">Ready?</h2>
          <ul id="rules"></ul>
          <div id="result" hidden>
            <p class="final"><span id="final-score">0</span> <span data-i18n="pointsUnit">pts</span><span id="grade" class="grade"></span></p>
            <dl id="result-counts" class="counts"></dl>
          </div>
          <p id="record"></p>
          <button type="button" disabled>Start</button>
        </section>
      </div>
      <dl id="counts" class="counts"></dl>
      <footer>
        <p class="controls" data-i18n="controls">A / D or ← / →: move the black cat · P / Esc: pause or resume</p>
        <label class="language"><span data-i18n="language">Language</span> <select id="language"></select></label>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
